# Per-item ARAT scoring rubrics. Source of truth for the rules: ARAT_scoring_guide.md.
#
# tracked_instance: BDDL instance of the manipulated object (resolved to the scene
#   object through the task catalog's instance map).
# target: what "placed at the target" means for this item.
# grasp: the hand-movement components required for a score of 3 (and, for pinch, the
#   mandatory finger opposition without which the item scores 0).
# object_size_m: characteristic size for the voluntary-opening check (the hand must
#   open at least to ~this aperture before contact).

